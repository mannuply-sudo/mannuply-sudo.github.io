<!DOCTYPE html>
<html>
<head>
<title>My To-Do List</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial}
.box{background:#222;width:320px;margin:20px auto;padding:20px;border-radius:15px}
input{width:70%;padding:12px;border-radius:10px;border:none;font-size:16px}
.addbtn{background:#00e676;color:black;padding:12px 15px;border:none;border-radius:10px;font-size:16px;font-weight:bold}
ul{list-style:none;padding:0;text-align:left}
li{background:#333;padding:12px;margin:8px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.done{text-decoration:line-through;color:#888}
.del{background:red;color:white;border:none;padding:5px 10px;border-radius:8px}
.tick{background:#00e676;border:none;padding:5px 10px;border-radius:8px}
</style>
</head>
<body>
<h1 style="color:#00e676">My To-Do List 📝</h1>
<div class="box">
<input id="task" placeholder="Kaam likho... ex: Padhai karni hai">
<button class="addbtn" onclick="addTask()">ADD</button>
<ul id="list"></ul>
</div>
<br>
<a href="index.html" style="color:#00e676">Back to Home</a>
<br><br>
<a href="calculator.html" style="color:#00e676">Go to Calculator</a>
<script>
function addTask(){
let t=document.getElementById('task');
if(t.value==''){alert('Pehle kuch likho!');return}
let li=document.createElement('li');
li.innerHTML='<span onclick="this.classList.toggle(\'done\')">'+t.value+'</span> <div><button class="tick" onclick="this.parentElement.parentElement.querySelector(\'span\').classList.toggle(\'done\')">✓</button> <button class="del" onclick="this.parentElement.parentElement.remove()">X</button></div>';
document.getElementById('list').appendChild(li);
t.value='';
}
</script>
</body>
</html>
