<!DOCTYPE html>
<html>
<head>
<title>Snake Game - By Aditya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background: #0a0a0a; color: white; font-family: Arial; text-align: center; padding: 10px; }
h1 { color: #00ff88; margin: 5px; }
h2 { color: #ffcc00; }
canvas { background: #1a1a1a; border: 3px solid #00ff88; border-radius: 10px; max-width: 95%; }
.btn { background: #222; color: white; border: 2px solid #333; width: 70px; height: 60px; font-size: 28px; border-radius: 15px; margin: 3px; }
.start { background: #00ff88; color: black; border: none; padding: 12px 30px; font-size: 18px; border-radius: 30px; font-weight: bold; margin: 10px; }
a { color: #00ff88; text-decoration: none; display: block; margin-top: 15px; }
</style>
</head>
<body>

<h1>🐍 Snake Game</h1>
<p>Made by Aditya 🔥</p>
<h2 id="score">Score: 0</h2>

<canvas id="game" width="300" height="300"></canvas>
<br>
<button class="start" onclick="startGame()">▶️ Start Game</button>
<br>
<button class="btn" onclick="setDir(0,-1)">⬆️</button><br>
<button class="btn" onclick="setDir(-1,0)">⬅️</button>
<button class="btn" onclick="setDir(0,1)">⬇️</button>
<button class="btn" onclick="setDir(1,0)">➡️</button>

<br><a href="portfolio.html">⬅️ Wapas Portfolio Pe Jao</a>

<script>
let c = document.getElementById("game");
let ctx = c.getContext("2d");
let snake = [{x:150,y:150}];
let food = {x:60,y:60};
let dx = 15, dy = 0;
let score = 0;
let gameOn = false;
let timer;

function setDir(x,y){
  if(x==-1 && dx==15) return;
  if(x==1 && dx==-15) return;
  if(y==-1 && dy==15) return;
  if(y==1 && dy==-15) return;
  dx = x*15; dy = y*15;
}
document.addEventListener("keydown", function(e){
  if(e.key=="ArrowUp") setDir(0,-1);
  if(e.key=="ArrowDown") setDir(0,1);
  if(e.key=="ArrowLeft") setDir(-1,0);
  if(e.key=="ArrowRight") setDir(1,0);
});

function startGame(){
  snake = [{x:150,y:150}];
  dx=15; dy=0; score=0; gameOn=true;
  document.getElementById("score").innerHTML = "Score: 0";
  newFood();
  clearInterval(timer);
  timer = setInterval(move, 150);
}
function newFood(){
  food.x = Math.floor(Math.random()*19)*15;
  food.y = Math.floor(Math.random()*19)*15;
}
function move(){
  if(!gameOn) return;
  let head = {x: snake[0].x+dx, y: snake[0].y+dy};
  if(head.x<0 || head.x>=300 || head.y<0 || head.y>=300){
    gameOver(); return;
  }
  for(let s of snake){ if(s.x==head.x && s.y==head.y){ gameOver(); return; } }
  snake.unshift(head);
  if(head.x==food.x && head.y==food.y){
    score+=10;
    document.getElementById("score").innerHTML = "Score: "+score;
    newFood();
  } else {
    snake.pop();
  }
  ctx.fillStyle="#1a1a1a"; ctx.fillRect(0,0,300,300);
  ctx.fillStyle="red"; ctx.fillRect(food.x,food.y,15,15);
  ctx.fillStyle="#00ff88";
  for(let s of snake){ ctx.fillRect(s.x,s.y,14,14); }
}
function gameOver(){
  gameOn=false; clearInterval(timer);
  document.getElementById("score").innerHTML = "💀 Game Over! Score: "+score+" - Dobara Start Dabao!";
}
</script>
</body>
</html>
